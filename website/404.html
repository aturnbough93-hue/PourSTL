<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Pour</title>
<meta name="theme-color" content="#0A0A0C">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root { --bg: #0A0A0C; --accent: #E8A87C; --text: #F7F7F8; --muted: #AEAEB2; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
  h1 { font-size: 48px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.03em; }
  p { color: var(--muted); margin-bottom: 28px; font-size: 17px; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .skip {
    position: absolute; left: -9999px; top: 8px; z-index: 200;
    background: var(--accent); color: #14100B; padding: 8px 14px; border-radius: 8px; font-weight: 600;
  }
  .skip:focus { left: 12px; }
</style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <main id="content" tabindex="-1">
    <h1>404</h1>
    <p>That page isn't on the bar.</p>
    <a href="/">Back to Pour</a>
  </main>
</body>
</html>
