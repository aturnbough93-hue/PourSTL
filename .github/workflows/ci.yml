name: Quality checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Static website regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_website.py
      - run: node --check website/site.js
      - name: Browser demo logic regression tests
        run: node scripts/test_demo.cjs
      - name: Check Cloudflare production and preview builds
        run: python3 -m unittest discover -s scripts -p 'test_build_website.py' -v

  ios:
    name: iOS simulator build and XCTest
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test on an available iPhone
        run: bash scripts/test_ios.sh
      - name: Retain test results and build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/PourTests.xcresult
            ${{ runner.temp }}/pour-xcodebuild.log
          retention-days: 7
          if-no-files-found: warn
